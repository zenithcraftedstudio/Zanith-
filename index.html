<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zanith Crafted Studio - Digital Patterns</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; padding: 20px; }
        .pattern-card { border: 1px solid #eee; border-radius: 8px; overflow: hidden; transition: 0.3s; background: #fff; }
        .pattern-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .pattern-img { width: 100%; height: 250px; object-fit: cover; background: #fafafa; }
        .pattern-info { padding: 15px; text-align: center; }
        .price { color: #c9a96e; font-weight: bold; font-size: 1.2em; }
        .buy-btn { background: #1a1a2e; color: #c9a96e; border: 1px solid #c9a96e; padding: 8px 20px; cursor: pointer; margin-top: 10px; width: 100%; }
        .buy-btn:hover { background: #c9a96e; color: #1a1a2e; }
    </style>
</head>
<body>
    <header style="text-align: center; padding: 50px 20px; background: #1a1a2e; color: white;">
        <h1>ZANITH CRAFTED STUDIO</h1>
        <p>Premium Geometric & Traditional Digital Patterns</p>
    </header>

    <main class="shop-grid" id="shop-container">
        <div style="grid-column: 1/-1; text-align: center; padding: 50px;">
            Đang tải những mẫu Pattern mới nhất...
        </div>
    </main>

    <footer style="text-align: center; padding: 40px; color: #888;">
        &copy; 2026 Zanith Crafted Studio. All Rights Reserved.
    </footer>

    <script src="zanith-shop-loader.js"></script> </body>
</html>
