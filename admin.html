<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zanith Admin - Quản lý cửa hàng</title>
    <link rel="stylesheet" href="style.css"> <script src="zanith-guard.js"></script> <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f9; padding: 20px; }
        .admin-container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h2 { color: #1a1a2e; border-bottom: 2px solid #c9a96e; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background: #1a1a2e; color: #c9a96e; }
        .btn-add { background: #c9a96e; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-bottom: 10px; }
        .status-tag { padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .profit-ok { background: #d4edda; color: #155724; }
        .profit-low { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="admin-container">
        <h2>🛍️ Quản lý sản phẩm & Lợi nhuận</h2>
        <button class="btn-add" onclick="addRow()">+ Thêm sản phẩm mới</button>
        
        <table id="productTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên sản phẩm (Pattern Name)</th>
                    <th>Giá bán ($)</th>
                    <th>Lợi nhuận ròng (Dự kiến)</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="productBody">
                </tbody>
        </table>

        <h2 style="margin-top: 40px;">📦 Đơn hàng gần đây (View Only)</h2>
        <table id="orderTable">
            <thead>
                <tr>
                    <th>Thời gian</th>
                    <th>Khách hàng</th>
                    <th>Sản phẩm</th>
                    <th>Giá thực bán</th>
                    <th>Trạng thái lãi 30%</th>
                </tr>
            </thead>
            <tbody id="orderBody">
                </tbody>
        </table>
    </div>

    <script>
        function addRow() {
            const tbody = document.getElementById('productBody');
            const row = tbody.insertRow();
            row.innerHTML = `
                <td><input type="text" placeholder="ID..."></td>
                <td><input type="text" placeholder="Tên mẫu..."></td>
                <td><input type="number" placeholder="0.00" onchange="calculateNet(this)"></td>
                <td class="net-display">-</td>
                <td><button onclick="this.parentElement.parentElement.remove()">Xóa</button></td>
            `;
        }

        function calculateNet(input) {
            const price = parseFloat(input.value);
            const netDisplay = input.parentElement.parentElement.querySelector('.net-display');
            if (price) {
                const net = price * 0.85; // Trừ 15% phí sàn
                const margin = (net / price) * 100;
                netDisplay.innerHTML = `$${net.toFixed(2)} (${margin}%)`;
                netDisplay.className = margin >= 30 ? 'net-display profit-ok' : 'net-display profit-low';
            }
        }
    </script>
</body>
</html>
